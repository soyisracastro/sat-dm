# electron-builder config — TodoConta Desktop
#
# Empaqueta el shell Electron + el binario PyInstaller del agente Python + el
# bundle estático de Next.js como un instalador Windows (NSIS).
#
# Comando: `pnpm build` desde desktop/ (encadena: build:agent → build:ui →
# electron-builder). Salida en desktop/dist/.
#
# CLAUDE.md / docs/versionado.md describen el flujo de versiones y release.

# -----------------------------------------------------------------------------
# Identidad
# -----------------------------------------------------------------------------

# IMMUTABLE: cambiar appId después rompe auto-update (Windows lo trata como app
# distinta). Mismo id que ya usa main.js en setAppUserModelId.
appId: com.todoconta.desktop

# Display name (cambiable después; el appId es lo estable).
productName: TodoConta

# Copyright en metadata del .exe.
copyright: Copyright © 2026 Israel Castro

# -----------------------------------------------------------------------------
# Deep links — protocolo `todoconta://`
# -----------------------------------------------------------------------------
# Registra el protocolo con el SO al instalar la app, para que la web pueda
# hacer redirects estilo `todoconta://activated?code=XXX` después del activate
# (flujo Notion: el SO lanza/enfoca la app automáticamente).

protocols:
  - name: TodoConta Desktop
    schemes:
      - todoconta

# -----------------------------------------------------------------------------
# Estructura de archivos
# -----------------------------------------------------------------------------

directories:
  # Carpeta con recursos del build (icon.ico, license.txt si se agrega).
  buildResources: build
  # Carpeta de salida (instaladores generados).
  output: dist

# Qué se incluye dentro del ASAR de Electron (código de la app).
files:
  - main.js
  - preload.js
  - assets/**/*
  - package.json
  - node_modules/**/*

# Recursos que viajan FUERA del ASAR (binarios externos, archivos grandes).
extraResources:
  # Binario PyInstaller del agente Python (carpeta onedir con sat-agent.exe + dlls).
  # Path relativo al `desktop/`.
  - from: ../packaging/dist/sat-agent
    to: agent
    filter: ['**/*']
  # Bundle estático del renderer Next.js (output: 'export' → ui/out/).
  - from: ../ui/out
    to: ui
    filter: ['**/*']

# -----------------------------------------------------------------------------
# Windows (NSIS)
# -----------------------------------------------------------------------------

win:
  target:
    - target: nsis
      arch: [x64]
  # electron-builder busca por default en buildResources (= build/). Solo
  # especificamos el nombre del archivo.
  icon: icon.ico
  # Nombre que aparece en la pestaña "Publisher" del .exe y SmartScreen.
  publisherName: TodoConta
  # ---------------------------------------------------------------------
  # Firma de código — pendiente de adquirir el certificado.
  # Ver docs/firma-codigo.md (decisión Azure Trusted Signing vs EV+nube).
  # ⚠️ La vía WIN_CSC_LINK (PFX) NO aplica a certs OV/EV modernos (2023+:
  # la llave vive en token/HSM, no en un .pfx exportable).
  #
  # Al tener la cuenta de Azure Trusted Signing: agregar los secrets al
  # repo (ver release.yml), descomentar este bloque y descomentar
  # `forceCodeSigning` abajo. El CI firma también sat-agent.exe en un
  # step propio ANTES de empacar (release.yml).
  #
  # azureSignOptions:
  #   publisherName: TodoConta
  #   endpoint: https://eus.codesigning.azure.net
  #   certificateProfileName: <AZURE_CERT_PROFILE>
  #   codeSigningAccountName: <AZURE_SIGNING_ACCOUNT>

# Cuando la firma esté activa: el build de release DEBE fallar si no puede
# firmar (evita publicar un instalador sin firma por un secret mal puesto).
# forceCodeSigning: true

nsis:
  # Wizard tradicional (Siguiente → Siguiente → Instalar), NO oneClick.
  # Razón: usuarios contables esperan confirmación de pasos.
  oneClick: false
  # Install por-usuario en %LOCALAPPDATA%\Programs\TodoConta (sin UAC).
  perMachine: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: TodoConta
  uninstallDisplayName: TodoConta
  # NO borrar ~/.sat-descarga/ al desinstalar (preserva FIELs cargadas, config
  # de empresas y buffer del procesador). Si el usuario quiere limpiar todo,
  # debe borrarlo manualmente.
  deleteAppDataOnUninstall: false
  # Tamaño de instalación visible en Panel de Control (informativo).
  artifactName: ${productName}-Setup-${version}.${ext}
  # license: build/license.txt    # Si se agrega EULA, descomentar.

# -----------------------------------------------------------------------------
# macOS — DMG por arquitectura (release.yml: job release-macos con matriz,
# porque PyInstaller no cross-compila el agente)
# -----------------------------------------------------------------------------

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: icon.png       # En macOS basta .png o .icns
  category: public.app-category.business
  # Firma + notarización (Apple Developer Program, cert "Developer ID
  # Application"). Sin identidad de firma en el runner, electron-builder
  # construye el DMG SIN firmar (warning, no error) — útil para QA con
  # clic-derecho → Abrir. Al agregar los secrets (ver release.yml y
  # docs/firma-codigo.md) se firma y notariza solo.
  #
  # hardenedRuntime es requisito de notarización; los entitlements cubren
  # Electron (JIT) y el agente PyInstaller (dylibs propios).
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Al activar la firma, descomentar para notarizar con notarytool (lee
  # APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID del env):
  # notarize: true
  # ⚠️ Validar en el PRIMER build firmado: que electron-builder firme también
  # los binarios del agente en Contents/Resources/agent/ (PyInstaller onedir).
  # Si la notarización rechaza binarios sin firma ahí, agregar:
  #   binaries:
  #     - "Contents/Resources/agent/sat-agent"
  # o un hook afterSign con `codesign --force --options runtime` recursivo.

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

# -----------------------------------------------------------------------------
# Linux — config lista pero CI no buildea
# -----------------------------------------------------------------------------

linux:
  target:
    - target: AppImage
      arch: [x64]
  icon: icon.png
  category: Office
  desktop:
    Name: TodoConta
    # Copy unificado con el `description` de package.json (tooltip del .exe en
    # Windows). Sin el prefijo "TodoConta Desktop —" porque el campo `Name` de
    # arriba ya muestra el nombre en el lanzador de Linux.
    Comment: Administración de CFDIs y herramientas fiscales
    Categories: Office;Finance

appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}

# -----------------------------------------------------------------------------
# Publicación (GitHub Releases)
# -----------------------------------------------------------------------------

publish:
  - provider: github
    owner: soyisracastro
    repo: sat-dm
    # El CI sube el .exe + latest.yml como draft release; el humano lo publica
    # manualmente desde la UI de GitHub.
    releaseType: draft
