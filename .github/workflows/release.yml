# Release Windows — TodoConta Desktop
#
# Trigger:
#   - Tag `v*.*.*` pushed a main → build automático.
#   - workflow_dispatch → build manual desde la UI de GitHub (útil para QA).
#
# Output:
#   - GitHub Release en estado DRAFT con:
#       - TodoConta-Setup-<version>.exe (instalador NSIS)
#       - latest.yml (metadata para electron-updater)
#   - El humano lo publica desde la UI cuando esté listo para anunciar.
#
# Secrets requeridos:
#   - GITHUB_TOKEN — provisto automáticamente por Actions (write a Releases).
#
# Secrets opcionales — firma de código con SSL.com eSigner (IV Code Signing;
# decisión 2026-06-11, ver docs/firma-codigo.md):
#   Los steps de firma se saltan solos si faltan; al agregarlos se activan.
#   - ES_USERNAME / ES_PASSWORD — cuenta de SSL.com.
#   - CREDENTIAL_ID — credencial de firma de eSigner (se ve al enrolar el cert).
#   - ES_TOTP_SECRET — secreto TOTP de "automated signing" de eSigner (permite
#     generar el OTP sin intervención humana; se crea en eSigner → settings).
#   El mismo juego de credenciales firma sat-agent.exe (step abajo) y los
#   binarios del shell (hook desktop/scripts/esigner-sign.js vía
#   electron-builder `win.signtoolOptions.sign`).
#
#   NOTA: la vieja vía WIN_CSC_LINK (PFX en base64) NO funciona con certs
#   modernos — desde 2023 la llave vive en token físico o HSM, no en un
#   .pfx exportable. Azure Trusted Signing quedó descartado: no acepta
#   entidades fuera de USA/CA/EU/UK (México no es elegible).
#
# Tiempo aproximado: 8-12 min.

name: Release Windows

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Firma de código (SSL.com eSigner). Vacíos hasta que el cert pase la
      # validación; los steps de firma/verificación se saltan solos mientras.
      ES_USERNAME: ${{ secrets.ES_USERNAME }}
      ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
      CREDENTIAL_ID: ${{ secrets.CREDENTIAL_ID }}
      ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # -------------------------------------------------------------------
      # Agente Python (PyInstaller)
      # -------------------------------------------------------------------

      - name: Install Python deps (server + ciec + pyinstaller)
        # `server` trae uvicorn/fastapi, `ciec` trae playwright (su driver es
        # parte del bundle; el chromium se descarga en runtime).
        run: pip install -e ".[server,ciec]" pyinstaller

      - name: Build sat-agent.exe con PyInstaller
        # `--distpath` y `--workpath` redirigen los outputs a `packaging/`
        # (default de PyInstaller es `./dist` y `./build` en CWD). El smoke
        # de abajo y `desktop/electron-builder.yml` (extraResources) esperan
        # el binario en `packaging/dist/sat-agent/sat-agent.exe`.
        run: pyinstaller packaging/sat-agent.spec --noconfirm --clean --distpath packaging/dist --workpath packaging/build

      - name: Setup CodeSignTool (eSigner)
        # CLI de firma de SSL.com (Java; el runner windows-latest ya trae JDK
        # con JAVA_HOME). Lo usan el step de abajo (agente) y el hook de
        # electron-builder (desktop/scripts/esigner-sign.js) vía la env
        # CODE_SIGN_TOOL_PATH. Se salta si no hay credenciales eSigner.
        if: env.ES_USERNAME != ''
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'codesigntool.zip'
          $dest = Join-Path $env:RUNNER_TEMP 'codesigntool'
          Invoke-WebRequest -Uri 'https://www.ssl.com/download/codesigntool-for-windows/' -OutFile $zip
          Expand-Archive $zip -DestinationPath $dest -Force
          # El zip a veces extrae los archivos en la raíz y a veces dentro de
          # una carpeta CodeSignTool-vX.Y.Z — resolver ambos layouts.
          $bat = Get-ChildItem $dest -Recurse -Filter 'CodeSignTool.bat' | Select-Object -First 1
          if (-not $bat) { throw 'CodeSignTool.bat no encontrado en el zip descargado.' }
          "CODE_SIGN_TOOL_PATH=$($bat.DirectoryName)" >> $env:GITHUB_ENV
          Write-Host "✓ CodeSignTool en $($bat.DirectoryName)"

      - name: Firmar sat-agent.exe (eSigner)
        # Firmar el AGENTE (no solo el instalador) es la mayor ganancia de
        # arranque: el binario PyInstaller sin firma dispara el escaneo
        # profundo de Defender en el primer arranque (confirmado en QA
        # v1.1.0: 1-2 min de congelamiento en frío, también al navegar).
        # Se salta si los secrets de eSigner no existen todavía.
        if: env.ES_USERNAME != ''
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'packaging\dist\sat-agent\sat-agent.exe'
          # CodeSignTool.bat referencia sus jars con paths relativos → cwd a su carpeta.
          Set-Location $env:CODE_SIGN_TOOL_PATH
          & .\CodeSignTool.bat sign `
            -username="$env:ES_USERNAME" `
            -password="$env:ES_PASSWORD" `
            -credential_id="$env:CREDENTIAL_ID" `
            -totp_secret="$env:ES_TOTP_SECRET" `
            -input_file_path="$exe" `
            -override=true
          # CodeSignTool no siempre propaga exit codes — verificación explícita.
          $sig = Get-AuthenticodeSignature $exe
          if ($sig.Status -ne 'Valid') { throw "sat-agent.exe quedó sin firma válida: $($sig.Status)" }
          Write-Host "✓ sat-agent.exe firmado ($($sig.SignerCertificate.Subject))"

      - name: Smoke test del agente empacado
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'packaging\dist\sat-agent\sat-agent.exe'
          if (-not (Test-Path $exe)) {
            throw "No se encontró el binario en $exe"
          }
          $proc = Start-Process -FilePath $exe -ArgumentList '--port','18787' -PassThru -WindowStyle Hidden
          try {
            $deadline = (Get-Date).AddSeconds(45)
            $ok = $false
            while ((Get-Date) -lt $deadline) {
              try {
                $r = Invoke-WebRequest -Uri 'http://127.0.0.1:18787/health' -UseBasicParsing -TimeoutSec 2
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if (-not $ok) { throw "El agente empacado no respondió a /health en 45s." }
            Write-Host "✓ /health OK"
          } finally {
            if ($proc -and -not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
          }

      # -------------------------------------------------------------------
      # Renderer Next.js (export estático)
      # -------------------------------------------------------------------

      - name: Build UI (Next.js export)
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # -------------------------------------------------------------------
      # Shell Electron (electron-builder, publish a GitHub Releases draft)
      # -------------------------------------------------------------------

      - name: Install desktop deps
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Build & publish instalador Windows
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # La firma de TodoConta.exe + uninstaller + instalador la hace
          # electron-builder llamando al hook scripts/esigner-sign.js
          # (win.signtoolOptions.sign). El hook usa las env ES_* del job y
          # CODE_SIGN_TOOL_PATH; sin credenciales se salta solo (build sin
          # firma, como siempre) — ver docs/firma-codigo.md.
        run: pnpm exec electron-builder --publish always

      - name: Verificar firmas (agente + instalador)
        # Solo cuando la firma está activa. Falla el release si algún binario
        # quedó sin firma válida — evita publicar un .exe a medias.
        if: env.ES_USERNAME != ''
        shell: pwsh
        run: |
          $objetivos = @(
            (Join-Path $env:GITHUB_WORKSPACE 'packaging\dist\sat-agent\sat-agent.exe')
          )
          $instalador = Get-ChildItem desktop/dist/*.exe | Select-Object -First 1
          if ($instalador) { $objetivos += $instalador.FullName }
          foreach ($exe in $objetivos) {
            $sig = Get-AuthenticodeSignature $exe
            if ($sig.Status -ne 'Valid') {
              throw "Firma inválida en ${exe}: $($sig.Status)"
            }
            Write-Host "✓ Firma válida: $exe ($($sig.SignerCertificate.Subject))"
          }

      - name: Subir artefactos a Actions (backup además del Release)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: todoconta-desktop-windows
          path: |
            desktop/dist/*.exe
            desktop/dist/latest.yml
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------
  # macOS — un DMG por arquitectura. PyInstaller NO cross-compila, así que
  # cada runner construye su agente nativo: macos-13 = Intel (x64),
  # macos-latest (14+) = Apple Silicon (arm64). El `artifactName` del dmg ya
  # incluye ${arch}, así que no chocan en el draft release.
  #
  # Firma/notarización: sin los secrets de Apple, electron-builder construye
  # el DMG SIN firmar (instalable con clic-derecho → Abrir; suficiente para
  # QA). Al agregar MAC_CSC_LINK + APPLE_* y descomentar `notarize` en
  # electron-builder.yml, sale firmado y notarizado. Ver docs/firma-codigo.md.
  #
  # NOTA electron-updater: cada arquitectura genera su propio latest-mac.yml
  # y el último en subir gana — el auto-update de macOS queda pendiente de
  # unificar ese metadata (no bloquea distribuir los DMG).
  # ---------------------------------------------------------------------
  release-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13
            arch: x64
          - runner: macos-latest
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      # Cert "Developer ID Application" exportado como .p12 en base64.
      # (A diferencia de Windows, Apple SÍ permite exportar la llave.)
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      # Notarización (notarytool) — se usan cuando `notarize` esté activo.
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Python deps (server + ciec + pyinstaller)
        run: pip install -e ".[server,ciec]" pyinstaller

      - name: Build sat-agent con PyInstaller (${{ matrix.arch }})
        run: pyinstaller packaging/sat-agent.spec --noconfirm --clean --distpath packaging/dist --workpath packaging/build

      - name: Smoke test del agente empacado
        run: |
          exe="packaging/dist/sat-agent/sat-agent"
          test -x "$exe" || { echo "No se encontró el binario en $exe"; exit 1; }
          "$exe" --port 18787 &
          pid=$!
          ok=""
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:18787/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 0.5
          done
          kill "$pid" 2>/dev/null || true
          [ -n "$ok" ] || { echo "El agente empacado no respondió a /health en 45s."; exit 1; }
          echo "✓ /health OK"

      - name: Build UI (Next.js export)
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install desktop deps
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Build & publish DMG (${{ matrix.arch }})
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec electron-builder --mac dmg --${{ matrix.arch }} --publish always

      - name: Subir artefactos a Actions (backup además del Release)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: todoconta-desktop-macos-${{ matrix.arch }}
          path: desktop/dist/*.dmg
          if-no-files-found: warn
          retention-days: 14
